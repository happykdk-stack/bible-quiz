:"타국인(거류민)","chapter":"41과 · 열왕기하 23:1-3 · 신명기 31:12-13"},{"id":111,"q":"말씀을 듣고 배워서 여호와 하나님을 어떻게 하라고 했나요?","a":"경외","chapter":"41과 · 열왕기하 23:1-3 · 신명기 31:12-13"},{"id":112,"q":"외할머니 로이스와 어머니 유니게로부터 어려서부터 성경을 배우고, 바울과 함께 복음을 전하였던 사람은 누구인가요?","a":"디모데","chapter":"42과 · 디모데후서 3:15-17"},{"id":113,"q":"성경은 우리에게 구원에 이르는 무엇을 주나요?","a":"지혜","chapter":"42과 · 디모데후서 3:15-17"},{"id":114,"q":"“모든 성경은 하나님의 ○○으로 된 것으로” 빈칸은?","a":"감동","chapter":"42과 · 디모데후서 3:15-17"},{"id":115,"q":"디모데후서 3장에 등장하는 성경이 유익한 네 가지는 무엇인가요?","a":"교훈, 책망, 바르게 함, 의로 교육함","chapter":"42과 · 디모데후서 3:15-17"},{"id":116,"q":"바울이 “부끄러워하지 아니하노니” 한 것은?","a":"복음","chapter":"43과 · 로마서 1:16-17"},{"id":117,"q":"복음은 모든 믿는 자에게 구원을 주시는 하나님의 무엇인가요?","a":"능력","chapter":"43과 · 로마서 1:16-17"},{"id":118,"q":"“오직 의인은 ○○으로 말미암아 살리라” 빈칸은?","a":"믿음","chapter":"43과 · 로마서 1:16-17"},{"id":119,"q":"평양지역에서 강명석도가 복음을 통해 변화되어서 처음으로 제주도에 복음을 전하신 목사님은 누구인가요?","a":"이기풍 목사님","chapter":"43과 · 로마서 1:16-17"},{"id":120,"q":"“오직 의인은 믿음으로”라는 로마서 1장 말씀을 통해 1517년 독일에서 종교개혁을 시작한 사람은?","a":"마틴 루터","chapter":"43과 · 로마서 1:16-17"}];
const $=id=>document.getElementById(id);let deck=[],idx=0,ratings={};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
for(const c of [...new Set(BANK.map(x=>x.chapter.split(' · ')[0]))]){let o=document.createElement('option');o.value=c;o.textContent=c;$('chapter').appendChild(o)}
function start(review=false){let selected=$('chapter').value;deck=review?deck.filter(x=>ratings[BANK.indexOf(x)]==='miss'):BANK.filter(x=>selected==='all'||x.chapter.startsWith(selected));deck=[...deck];if($('order').value==='random')shuffle(deck);idx=0;if(!review)ratings={};render()}
function render(){if(!deck.length){$('question').textContent='복습할 카드가 없어요! 🎉';$('answer').textContent='참 잘했어요!';$('topic').textContent='학습 완료';$('counter').textContent='0 / 0';$('bar').style.width='100%';$('flash').classList.remove('flipped');return}let x=deck[idx];$('topic').textContent='원본 '+x.id+'번 · '+x.chapter;$('question').textContent=x.q;$('answer').textContent=x.a;$('counter').textContent='원본 '+x.id+'번 · 카드 '+(idx+1)+' / '+deck.length;$('bar').style.width=((idx+1)/deck.length*100)+'%';$('flash').classList.remove('flipped');$('prev').disabled=idx===0;$('next').textContent=idx===deck.length-1?'처음으로 ↻':'다음 →';let vals=Object.values(ratings);$('score').textContent='알아요 '+vals.filter(x=>x==='know').length+' · 몰라요 '+vals.filter(x=>x==='miss').length}
function flip(){$('flash').classList.toggle('flipped')}
function next(){if(!deck.length)return;idx=(idx+1)%deck.length;render()}
function mark(value){if(!deck.length)return;ratings[BANK.indexOf(deck[idx])]=value;next()}
$('flash').addEventListener('click',flip);$('flash').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});$('know').onclick=()=>mark('know');$('miss').onclick=()=>mark('miss');$('next').onclick=next;$('prev').onclick=()=>{if(idx>0){idx--;render()}};$('restart').onclick=()=>start();$('chapter').onchange=()=>start();$('order').onchange=()=>start();$('review').onclick=()=>start(true);start();
</script></body></html>
