*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#effaf2,#eaf3ff);font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#234438}.wrap{max-width:720px;margin:auto;padding:22px 16px 45px}h1{text-align:center;font-size:clamp(26px,6vw,36px);margin:10px 0 6px;color:#167d56}.sub{text-align:center;color:#688478;margin:0 0 18px}.panel{background:#fff;border-radius:20px;padding:15px;box-shadow:0 9px 25px #204c3212}.settings{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.settings select,.settings button{border:1px solid #cce4d5;background:#fff;border-radius:12px;padding:11px;font-size:15px}.settings select{flex:1;min-width:145px}.settings button{background:#177c58;color:#fff;border:0;font-weight:700}.stats{display:flex;justify-content:space-between;gap:8px;margin:19px 2px 10px;color:#4d6d60;font-weight:650;font-size:14px}.track{height:9px;background:#dceee5;border-radius:20px;overflow:hidden;margin-bottom:18px}.bar{height:100%;width:0;background:#28aa77;transition:width .2s}.flash{width:100%;min-height:340px;position:relative;perspective:1100px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.inner{position:relative;width:100%;min-height:340px;transition:transform .55s;transform-style:preserve-3d}.flash.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:27px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;box-shadow:0 14px 32px #28583d25}.front{background:linear-gradient(145deg,#fff,#eaf9f1);border:2px solid #bce7d1}.back{background:linear-gradient(145deg,#fff6dc,#fff);border:2px solid #f4d58c;transform:rotateY(180deg)}.tag{font-size:14px;color:#638576;font-weight:750;margin-bottom:24px}.question{font-size:clamp(21px,5vw,30px);font-weight:850;line-height:1.5;word-break:keep-all}.answer{font-size:clamp(28px,7vw,42px);font-weight:900;color:#b </style></head><body><main class="wrap"><h1>📖 성경퀴즈 낱말카드</h1><p class="sub">문제를 읽고 생각한 뒤 카드를 눌러 정답을 확인해요!</p><section class="panel settings"><select id="chapter" aria-label="단원 선택"><option value="all">전체 단원</option></select><select id="order" aria-label="학습 순서"><option value="sequential">자료 순서대로</option><option value="random">무작위로 섞기</option></select><button id="restart">처음부터</button></section><div class="stats"><span id="counter">1 / 1</span><span id="score">알아요 0 · 몰라요 0</span></div><div class="track"><div class="bar" id="bar"></div></div><div class="flash" id="flash" role="button" tabindex="0" aria-label="카드 뒤집기"><div class="inner"><div class="face front"><div class="tag" id="topic">문제</div><div class="question" id="question"></div><div class="tip">👆 카드를 누르면 정답이 나와요</div></div><div class="face back"><div class="tag">✨ 정답</div><div class="answer" id="answer"></div><div class="tip">👆 다시 누르면 문제로 돌아가요</div></div></div></div><div class="buttons"><button class="btn warn" id="miss">❓ 몰라요</button><button class="btn primary" id="know">✅ 알아요</button></div><div class="bottom"><button class="btn" id="prev">← 이전</button><button class="btn" id="next">다음 →</button></div><div class="bottom"><button class="btn" id="review">🔁 몰랐던 카드만 복습</button></div><p class="note">인터넷 연결 없이 실행할 수 있습니다. 문제는 첨부 자료 기반 선별 문항입니다.</p></main><script>
const BANK=[{"q": "레위기 19장을 말씀하실 때 하나님은 누구에게 말씀하셨나요?", "a": "모세", "chapter": "21과 · 레위기 19:1-18"}, {"q": "“너희는 거룩하라”라고 하신 이유는 무엇인가요?", "a": "거룩", "chapter": "21과 · 레위기 19:1-18"}, {"q": "부모님을 경외하라는 말씀과 함께 지키라고 하신 것은?", "a": "안식일", "chapter": "21과 · 레위기 19:1-18"}, {"q": "하나님께 드리는 제물 가운데 레위기 19장 5절에 나오는 것은?", "a": "화목제물", "chapter": "21과 · 레위기 19:1-18"}, {"q": "앞을 보지 못하는 사람 앞에 놓지 말라고 하신 것은?", "a": "장애물", "chapter": "21과 · 레위기 19:1-18"}, {"q": "“네 이웃 사랑하기를 네 □□ 같이 사랑하라” 빈칸은?", "a": "네 자신", "chapter": "21과 · 레위기 19:1-18"}, {"q": "곡식을 거둘 때 밭에 남겨 두라고 하신 것은 누구를 위한 것인가요?", "a": "거류민", "chapter": "21과 · 레위기 19:1-18"}, {"q": "하나님이 주시겠다고 약속한 땅은 무엇과 무엇이 흐르는 땅인가요?", "a": "젖과 꿀", "chapter": "22과 · 신명기 6:1-9"}, {"q": "하나님은 신명기에서 누구에게 말씀을 부지런히 가르치라고 하셨나요?", "a": "자녀", "chapter": "22과 · 신명기 6:1-9"}, {"q": "성경 말씀을 손목에 매고 어디에 표로 삼으라고 했나요?", "a": "미간", "chapter": "22과 · 신명기 6:1-9"}, {"q": "성경 말씀을 집의 바깥 문과 어디에 기록하라고 했나요?", "a": "문설주", "chapter": "22과 · 신명기 6:1-9"}, {"q": "하나님은 사람에게 모든 생물을 어떻게 하라고 하셨나요?", "a": "다스리라", "chapter": "24과 · 야고보서 1:15"}, {"q": "우리가 살고 있는 지구의 환경이 나빠진 이유는 무엇인가요?", "a": "사람들의 욕심과 죄", "chapter": "24과 · 야고보서 1:15"}, {"q": "로마서 8장 25절에서 보이지 않는 것을 바라면 무엇으로 기다리라고 했나요?", "a": "참음", "chapter": "25과 · 로마서 8:19-25"}, {"q": "하나님께 두 막대기 이야기를 들은 선지자는 누구인가요?", "a": "에스겔", "chapter": "26과 · 에스겔 37:15-23"}, {"q": "첫째 막대기에 쓴 이름은 무엇인가요?", "a": "유다", "chapter": "26과 · 에스겔 37:15-23"}, {"q": "둘째 막대기에 쓴 이름은 무엇인가요?", "a": "요셉", "chapter": "26과 · 에스겔 37:15-23"}, {"q": "하나님은 하나 된 나라를 몇 명의 왕이 다스리게 하겠다고 하셨나요?", "a": "한 임금", "chapter": "26과 · 에스겔 37:15-23"}, {"q": "제자들이 한곳에 모여 있을 때 성령이 임하신 날은?", "a": "오순절", "chapter": "27과 · 사도행전 2:1-21"}, {"q": "하늘로부터 급하고 강한 무엇 같은 소리가 났나요?", "a": "바람", "chapter": "27과 · 사도행전 2:1-21"}, {"q": "각 사람 위에 하나씩 임한 것은 무엇의 혀처럼 갈라진 모양이었나요?", "a": "불", "chapter": "27과 · 사도행전 2:1-21"}, {"q": "성령이 충만한 제자들은 무엇으로 말하기 시작했나요?", "a": "다른 언어", "chapter": "27과 · 사도행전 2:1-21"}, {"q": "스데반이 본 하늘에 서 계신 분은 누구인가요?", "a": "인자", "chapter": "28과 · 사도행전 7:43-8:1"}, {"q": "스데반에게 돌을 던진 사람들이 옷을 맡긴 청년은?", "a": "사울", "chapter": "28과 · 사도행전 7:43-8:1"}, {"q": "사도행전 10장에 등장하는 로마 군대의 백부장 이름은?", "a": "고넬료", "chapter": "29과 · 사도행전 10:1-43"}, {"q": "고넬료가 살던 도시는 어디인가요?", "a": "가이사랴", "chapter": "29과 · 사도행전 10:1-43"}, {"q": "베드로가 머물고 있던 도시는 어디인가요?", "a": "욥바", "chapter": "29과 · 사도행전 10:1-43"}, {"q": "베드로가 지내던 집의 주인, 무두장이의 이름은?", "a": "시몬", "chapter": "29과 · 사도행전 10:1-43"}, {"q": "베드로가 기도할 때 하늘에서 내려온 그릇은 무엇 같았나요?", "a": "큰 보자기", "chapter": "29과 · 사도행전 10:1-43"}, {"q": "사울이 예수님을 만나러 가던 도시는 어디인가요?", "a": "다메섹", "chapter": "30과 · 사도행전 9:1-19"}, {"q": "“나는 네가 박해하는 □□라” 빈칸은?", "a": "예수", "chapter": "30과 · 사도행전 9:1-19"}, {"q": "사울에게 보냄 받은 다메섹의 제자는 누구인가요?", "a": "아나니아", "chapter": "30과 · 사도행전 9:1-19"}, {"q": "사울이 머물던 유다의 집이 있던 거리 이름은?", "a": "직가", "chapter": "30과 · 사도행전 9:1-19"}, {"q": "아나니아가 안수하자 사울의 눈에서 무엇 같은 것이 벗겨졌나요?", "a": "비늘", "chapter": "30과 · 사도행전 9:1-19"}, {"q": "다시 보게 된 사울이 일어나 받은 것은?", "a": "세례", "chapter": "30과 · 사도행전 9:1-19"}, {"q": "제자들이 처음으로 그리스도인이라 불린 곳은?", "a": "안디옥", "chapter": "31과 · 사도행전 11:19-30"}, {"q": "예루살렘 교회가 안디옥으로 보낸 사람은?", "a": "바나바", "chapter": "31과 · 사도행전 11:19-30"}, {"q": "바나바가 바울을 찾으러 간 도시는?", "a": "다소", "chapter": "31과 · 사도행전 11:19-30"}, {"q": "온 세상에 큰 흉년이 들 것을 미리 말한 선지자는?", "a": "아가보", "chapter": "31과 · 사도행전 11:19-30"}, {"q": "그 흉년은 어느 로마 황제 때에 들었나요?", "a": "글라우디오", "chapter": "31과 · 사도행전 11:19-30"}, {"q": "바울이 아덴에서 본 것은 무엇인가요?", "a": "우상", "chapter": "32과 · 사도행전 17:16-31"}, {"q": "바울과 논쟁한 두 무리의 철학자들은?", "a": "에피쿠로스와 스토아", "chapter": "32과 · 사도행전 17:16-31"}, {"q": "바울이 서서 아덴 사람들에게 하나님을 전한 곳은?", "a": "아레오바고", "chapter": "32과 · 사도행전 17:16-31"}, {"q": "아덴 사람들이 제단에 새겨진 글은 무엇이었나요?", "a": "알지 못하는 신에게", "chapter": "32과 · 사도행전 17:16-31"}, {"q": "바울은 하나님을 떠난 사람에게 무엇을 하라고 명하셨다고 했나요?", "a": "회개", "chapter": "32과 · 사도행전 17:16-31"}, {"q": "바울은 한 혈통으로부터 무엇을 만드셨다고 했나요?", "a": "모든 민족", "chapter": "32과 · 사도행전 17:16-31"}, {"q": "바울이 탄 알렉산드리아 배의 표시는?", "a": "디오스구로", "chapter": "33과 · 사도행전 28:11-31"}, {"q": "바울이 마침내 도착한 큰 도시는?", "a": "로마", "chapter": "33과 · 사도행전 28:11-31"}, {"q": "로마의 형제들이 바울을 맞으러 나온 두 곳은?", "a": "압비오 광장과 트레이스 타베르네", "chapter": "33과 · 사도행전 28:11-31"}, {"q": "바울은 이스라엘의 소망 때문에 무엇에 매였다고 했나요?", "a": "쇠사슬", "chapter": "33과 · 사도행전 28:11-31"}, {"q": "바울은 자기 셋집에서 얼마 동안 머물렀나요?", "a": "2년", "chapter": "33과 · 사도행전 28:11-31"}, {"q": "고넬료가 백성을 위해 많이 한 일은?", "a": "구제", "chapter": "34과 · 사도행전 10:2,24,31-33"}, {"q": "고넬료가 하나님께 항상 한 것은?", "a": "기도", "chapter": "34과 · 사도행전 10:2,24,31-33"}, {"q": "베드로를 기다리며 고넬료가 집에 모은 사람들은?", "a": "친척과 가까운 친구들", "chapter": "34과 · 사도행전 10:2,24,31-33"}, {"q": "다윗을 자기 생명처럼 사랑한 친구는?", "a": "요나단", "chapter": "35과 · 사무엘상 20:17"}, {"q": "요나단이 자기 생명을 사랑함 같이 사랑한 친구는?", "a": "다윗", "chapter": "35과 · 사무엘상 20:17"}, {"q": "요나단은 다윗을 사랑하여 다시 무엇을 하게 했나요?", "a": "맹세", "chapter": "35과 · 사무엘상 20:17"}, {"q": "하나님이 기뻐하시는 거룩한 산 제물로 드리라고 한 것은?", "a": "몸", "chapter": "36과 · 로마서 12:1-2"}, {"q": "우리 몸을 산 제물로 드리는 것은 “영적 □□”라고 했나요?", "a": "예배", "chapter": "36과 · 로마서 12:1-2"}, {"q": "“너희는 이 □□를 본받지 말고” 빈칸은?", "a": "세대", "chapter": "36과 · 로마서 12:1-2"}, {"q": "무엇을 새롭게 하여 변화를 받으라고 했나요?", "a": "마음", "chapter": "36과 · 로마서 12:1-2"}, {"q": "예수님은 모든 도시와 마을을 다니시며 어디에서 가르치셨나요?", "a": "회당", "chapter": "37과 · 마태복음 9:35-38"}, {"q": "예수님이 두루 다니며 전하신 것은?", "a": "천국 복음", "chapter": "37과 · 마태복음 9:35-38"}, {"q": "고생하며 기진한 무리는 무엇과 같았나요?", "a": "목자 없는 양", "chapter": "37과 · 마태복음 9:35-38"}, {"q": "“추수할 것은 많되 □□이 적으니” 빈칸은?", "a": "일꾼", "chapter": "37과 · 마태복음 9:35-38"}, {"q": "“예수께서 하나님의 □□ 그리스도이심을 믿게 하려 함이요” 빈칸은?", "a": "아들", "chapter": "38과 · 요한복음 20:31"}, {"q": "예수님을 믿는 사람은 그 이름을 힘입어 무엇을 얻나요?", "a": "생명", "chapter": "38과 · 요한복음 20:31"}, {"q": "요한복음 20장 31절에서 예수님은 하나님의 아들이시며 누구이신가요?", "a": "그리스도", "chapter": "38과 · 요한복음 20:31"}, {"q": "하나님이 모세에게 함께 올라오라고 하신 모세의 형 이름은?", "a": "아론", "chapter": "39과 · 출애굽기 24:1-11"}, {"q": "아론과 함께 올라간 아론의 두 아들은?", "a": "나답과 아비후", "chapter": "39과 · 출애굽기 24:1-11"}, {"q": "함께 올라간 이스라엘 장로는 몇 명인가요?", "a": "칠십 명", "chapter": "39과 · 출애굽기 24:1-11"}, {"q": "모세가 백성에게 낭독해 들려준 책의 이름은?", "a": "언약서", "chapter": "39과 · 출애굽기 24:1-11"}, {"q": "하나님의 발 아래는 무엇을 편 듯했나요?", "a": "청옥", "chapter": "39과 · 출애굽기 24:1-11"}, {"q": "예수님에 대해 기록된 일은 모두 기록하면 세상도 그 책을 두기에 부족하다는 말씀은 어느 복음서인가요?", "a": "요한복음", "chapter": "40과 · 누가복음 24:44-48"}, {"q": "예수님은 제자들의 마음을 열어 무엇을 깨닫게 하셨나요?", "a": "성경", "chapter": "40과 · 누가복음 24:44-48"}, {"q": "그리스도는 고난을 받고 며칠째 되는 날 다시 살아나셨나요?", "a": "3일", "chapter": "40과 · 누가복음 24:44-48"}, {"q": "회개와 죄 사함의 복음이 전해지기 시작할 도시는?", "a": "예루살렘", "chapter": "40과 · 누가복음 24:44-48"}, {"q": "“너희는 이 모든 일의 □□이라” 빈칸은?", "a": "증인", "chapter": "40과 · 누가복음 24:44-48"}, {"q": "성전에서 발견한 책을 온 백성에게 읽어 들려준 유다 왕은?", "a": "요시야", "chapter": "41과 · 열왕기하 23:1-3"}, {"q": "요시야 왕이 읽은 책의 이름은?", "a": "언약책", "chapter": "41과 · 열왕기하 23:1-3"}, {"q": "요시야 왕과 백성이 함께 올라간 곳은?", "a": "여호와의 성전", "chapter": "41과 · 열왕기하 23:1-3"}, {"q": "말씀을 듣고 배워서 여호와 하나님을 어떻게 하라고 했나요?", "a": "경외", "chapter": "41과 · 신명기 31:12-13"}, {"q": "외할머니 로이스와 어머니 유니게로부터 어려서부터 성경을 배운 사람은?", "a": "디모데", "chapter": "42과 · 디모데후서 3:15-17"}, {"q": "성경은 우리에게 구원에 이르는 무엇을 주나요?", "a": "지혜", "chapter": "42과 · 디모데후서 3:15-17"}, {"q": "디모데후서 3장에 나오는 성경의 유익 네 가지는?", "a": "교훈·책망·바르게 함·의로 교육함", "chapter": "42과 · 디모데후서 3:15-17"}, {"q": "바울이 “부끄러워하지 아니하노니”라고 한 것은?", "a": "복음", "chapter": "43과 · 로마서 1:16-17"}, {"q": "복음은 모든 믿는 자에게 구원을 주시는 하나님의 무엇인가요?", "a": "능력", "chapter": "43과 · 로마서 1:16-17"}, {"q": "“오직 의인은 □□으로 말미암아 살리라” 빈칸은?", "a": "믿음", "chapter": "43과 · 로마서 1:16-17"}, {"q": "평양지역에서 복음을 전해 받은 뒤 성경을 한글로 번역하는 일에 참여한 사람은?", "a": "이기풍 목사님", "chapter": "43과 · 자료 119번"}, {"q": "“오직 의인은 믿음으로”라는 로마서 1장 말씀을 통해 종교개혁을 시작한 사람은?", "a": "마틴 루터", "chapter": "43과 · 자료 120번"}];
const $=id=>document.getElementById(id);let deck=[],idx=0,ratings={};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
for(const c of [...new Set(BANK.map(x=>x.chapter.split(' · ')[0]))]){let o=document.createElement('option');o.value=c;o.textContent=c;$('chapter').appendChild(o)}
function start(review=false){let selected=$('chapter').value;deck=review?deck.filter(x=>ratings[BANK.indexOf(x)]==='miss'):BANK.filter(x=>selected==='all'||x.chapter.startsWith(selected));deck=[...deck];if($('order').value==='random')shuffle(deck);idx=0;if(!review)ratings={};render()}
function render(){if(!deck.length){$('question').textContent='복습할 카드가 없어요! 🎉';$('answer').textContent='참 잘했어요!';$('topic').textContent='학습 완료';$('counter').textContent='0 / 0';$('bar').style.width='100%';$('flash').classList.remove('flipped');return}let x=deck[idx];$('topic').textContent=x.chapter;$('question').textContent=x.q;$('answer').textContent=x.a;$('counter').textContent=(idx+1)+' / '+deck.length;$('bar').style.width=((idx+1)/deck.length*100)+'%';$('flash').classList.remove('flipped');$('prev').disabled=idx===0;$('next').textContent=idx===deck.length-1?'처음으로 ↻':'다음 →';let vals=Object.values(ratings);$('score').textContent='알아요 '+vals.filter(x=>x==='know').length+' · 몰라요 '+vals.filter(x=>x==='miss').length}
function flip(){$('flash').classList.toggle('flipped')}
function next(){if(!deck.length)return;idx=(idx+1)%deck.length;render()}
function mark(value){if(!deck.length)return;ratings[BANK.indexOf(deck[idx])]=value;next()}
$('flash').addEventListener('click',flip);$('flash').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});$('know').onclick=()=>mark('know');$('miss').onclick=()=>mark('miss');$('next').onclick=next;$('prev').onclick=()=>{if(idx>0){idx--;render()}};$('restart').onclick=()=>start();$('chapter').onchange=()=>start();$('order').onchange=()=>start();$('review').onclick=()=>start(true);start();
</script></body></html>
